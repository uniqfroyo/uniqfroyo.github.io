<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Payment method · wheel dropdown</title>
<style>
  :root { --bg:#fff; --card:#fdfdfd; --hl:#ededed; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); overflow:hidden;
    font-family: "SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,Inter,"Inter Tight","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  #stage { position:fixed; left:50%; top:50%; width:0; height:0; }
  /* every layer is positioned from the component centre (0,0) */
  #shadow, #card { position:absolute; left:0; top:0; will-change:transform; }
  #card {
    width:394px; height:383px; margin:-191.5px 0 0 -197px;
    contain:layout style; touch-action:none; cursor:pointer;
  }
  #bg {
    position:absolute; left:0; top:0; width:292px; height:65px;
    background:var(--card); border-radius:20px;
    box-shadow: 0 0 0 .5px rgba(0,0,0,.03), 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.05), 0 22px 54px rgba(0,0,0,.085);
    will-change:transform,width,height;
  }
  #clip { position:absolute; inset:0; will-change:clip-path; }
  #card:focus { outline:none; }
  #card.open { cursor:grab; }
  #card.dragging { cursor:grabbing; }
  #hl {
    position:absolute; left:0; top:0; width:284px; height:60px; border-radius:12px;
    background:var(--hl); will-change:transform,opacity;
  }
  #ticks { position:absolute; left:0; top:0; overflow:visible; will-change:opacity; }
  #arrow { position:absolute; left:0; top:0; width:10px; height:12px; will-change:transform; }
  .item {
    position:absolute; left:0; top:0; height:30px; display:flex; align-items:center;
    transform-origin:0 50%; white-space:nowrap; will-change:transform,opacity; pointer-events:none;
  }
  .ic { width:30px; height:22px; border-radius:5px; flex:none; position:relative; overflow:hidden;
        will-change:opacity; }
  .ic { display:flex; align-items:center; justify-content:center; }
  .ic.tile { background:#fff; }
  .ic.tile::after { content:""; position:absolute; inset:0; border-radius:5px; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.16); }
  .ic.badge { overflow:visible; box-shadow:none; background:none; }
  .ic .mk { flex:none; }
  .ic svg { display:block; width:100%; height:100%; }
  .lbl { position:relative; margin-left:16px; font-size:18px; line-height:30px; letter-spacing:-.1px; color:#000; }
  .lbl span { display:block; will-change:opacity; }
  .lbl .m { position:absolute; left:0; top:0; font-weight:500; }
  .lbl .r { font-weight:500; color:transparent; } /* sizer (keeps width of medium) */
  .lbl .r2 { position:absolute; left:0; top:0; font-weight:400; }
  #mute {
    position:fixed; right:18px; bottom:18px; width:36px; height:36px; border-radius:18px; border:0;
    background:rgba(255,255,255,.7); color:#555; cursor:pointer; display:grid; place-items:center;
    box-shadow:0 1px 3px rgba(0,0,0,.08); transition:opacity .2s; opacity:.55;
  }
  #mute:hover { opacity:1; }
  #mute svg { width:18px; height:18px; }
  #stage { transform:scale(var(--embed-scale,1)); }
</style>
</head>

  </div>
</div>

      S.vel += a * h; S.pos += S.vel * h;
    }
    if (Math.abs(S.target - S.pos) < 0.0008 && Math.abs(S.vel) < 0.02) { S.pos = S.target; S.vel = 0; S.mode = 'rest'; }
  }
  // tick sound whenever a row crosses the centre line
  const f = Math.floor(S.pos + 1e-6);
  if (f !== S.lastFloor) {
    const sp = Math.abs(S.pos - prev) / Math.max(dt, 1e-3);
    tick(sp);
    S.lastFloor = f;
  }
  if (S.mode === 'rest' && Math.abs(S.pos) > 1e6) S.pos = mod(S.pos, N);
  render();
  if (embedActive && !document.hidden) frameId = requestAnimationFrame(frame);
}

/* ---------------- motion helpers ---------------- */
function springTo(t) { S.target = t; S.mode = 'spring'; }
function glideFrom(v) {
  // momentum: exponential decay that lands exactly on a row
  const TAU = 0.32;
  const p0 = S.pos;
  let end = Math.round(p0 + v * TAU);
  let dist = end - p0;
  if (Math.abs(v) < 0.4 || Math.sign(dist) !== Math.sign(v) || Math.abs(dist) < 0.05) { springTo(Math.round(p0)); return; }
  const tau = clamp(dist / v, 0.14, 0.7);
  S.glide = { p0, dist, tau, t: 0 }; S.mode = 'glide';
}
function snapNow() { springTo(Math.round(S.mode === 'spring' ? S.target : S.pos)); }

/* ---------------- open / close ---------------- */
function setOpen(o) {
  if (S.open === o) return;
  S.open = o;
  card.classList.toggle('open', o);
  card.setAttribute('aria-expanded', o);
  if (!o) { snapNow(); }
}

/* ---------------- pointer: drag + click ---------------- */
let drag = null;
card.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  ensureAudio();
  drag = { id: e.pointerId, y0: e.clientY, x0: e.clientX, pos0: S.pos, moved: false, samples: [{ t: performance.now(), y: e.clientY }] };
  if (!S.open) { setOpen(true); drag.openedHere = true; return; }   // opens on press, like the reference
  {
    if (S.mode !== 'rest') { drag.wasMoving = true; }
    S.mode = 'drag'; S.vel = 0;
    card.setPointerCapture(e.pointerId);
  }
});
card.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || !S.open || drag.openedHere) return;
  const dy = e.clientY - drag.y0;
  if (!drag.moved && Math.abs(dy) > 4) { drag.moved = true; card.classList.add('dragging'); drag.y0 = e.clientY; drag.pos0 = S.pos; }
  if (drag.moved) S.pos = drag.pos0 - (e.clientY - drag.y0) / G.rowH;
  const now = performance.now();
  drag.samples.push({ t: now, y: e.clientY });
  while (drag.samples.length > 2 && now - drag.samples[0].t > 90) drag.samples.shift();
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  card.classList.remove('dragging');
  if (d.openedHere || !S.open) return;
  if (d.moved) {
    const s = d.samples, a = s[0], b = s[s.length - 1];
    const dtm = Math.max(16, b.t - a.t);
    const v = -((b.y - a.y) / G.rowH) / (dtm / 1000);   // items/s
    glideFrom(performance.now() - b.t > 80 ? 0 : v);
    return;
  }
  if (cancelled) { snapNow(); return; }
  if (d.wasMoving) { snapNow(); return; }             // tap to stop a spin
  // a tap: centre row closes, other rows scroll to the centre
  const r = card.getBoundingClientRect();
  const ly = (e.clientY - r.top) - OY;
  const off = Math.round(ly / G.rowH);
  if (off === 0 || Math.abs(ly) < G.hlH / 2) { S.mode = 'rest'; S.pos = Math.round(S.pos); setOpen(false); }
  else springTo(Math.round(S.pos) + clamp(off, -2, 2));
}
card.addEventListener('pointerup', e => endDrag(e, false));
card.addEventListener('pointercancel', e => endDrag(e, true));

/* ---------------- wheel / trackpad ---------------- */
card.addEventListener('wheel', e => {
  e.preventDefault();
  if (!S.open) return;
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
  const base = S.mode === 'spring' ? S.target : S.pos;
  S.vel = S.mode === 'spring' ? S.vel : 0;
  S.target = base + dy / 62;                          // ~1 row per notch / 62px trackpad travel
  S.mode = 'spring';
  clearTimeout(S.wheelTimer);
  S.wheelTimer = setTimeout(() => { if (S.mode === 'spring') S.target = Math.round(S.target); }, 120);
}, { passive: false });

/* ---------------- outside click / keyboard ---------------- */
document.addEventListener('pointerdown', e => { if (!card.contains(e.target) && e.target !== muteBtn && !muteBtn.contains(e.target)) setOpen(false); });
document.addEventListener('keydown', e => {
  ensureAudio();
  if (e.key === 'Escape') setOpen(false);
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setOpen(!S.open); }
  else if (S.open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    springTo(Math.round(S.mode === 'spring' ? S.target : S.pos) + (e.key === 'ArrowDown' ? 1 : -1));
  }
});

/* test hooks (used by the screenshot harness; harmless in normal use) */
window.__wheel = { S, setOpen, springTo, glideFrom, render, N, get audio() { return actx && actx.state; } };

function fit() {
  // An offscreen iframe can briefly report an empty viewport during mounting.
  if (innerWidth <= 32 || innerHeight <= 64) return;
  const scale = Math.min(1, (innerWidth - 32) / 394, (innerHeight - 64) / 383);
  document.documentElement.style.setProperty('--embed-scale', String(scale));
}
fit();
addEventListener('resize', fit);
new ResizeObserver(fit).observe(document.documentElement);
function syncPlayback() {
  cancelAnimationFrame(frameId);
  if (embedActive && !document.hidden) { last = performance.now(); frameId = requestAnimationFrame(frame); }
}
addEventListener('message', event => {
  if (event.source !== parent || event.data?.type !== 'motion-playground') return;
  embedActive = !!event.data.active;
  if (embedActive) fit();
  syncPlayback();
});
document.addEventListener('visibilitychange', syncPlayback);
addEventListener('contextmenu', event => event.preventDefault());
addEventListener('dragstart', event => event.preventDefault());
render();
syncPlayback();
})();
</script>
</body>
</html>
