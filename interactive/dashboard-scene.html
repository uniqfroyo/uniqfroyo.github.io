function knobIdx(T){if(T<=kn[0][0])return kn[0][1];for(let i=1;i<kn.length;i++){if(T<=kn[i][0]){const u=(T-kn[i-1][0])/(kn[i][0]-kn[i-1][0]);return kn[i-1][1]+(kn[i][1]-kn[i-1][1])*eIO(u)}}return 7}
function render(t){
  const T= t<0.9 ? 99 : t; // before 0.9 we show the finished dashboard (fading out)
  root.style.opacity = t<0.58 ? 1 : t<0.9 ? 1-eIO((t-0.58)/0.32) : 1;
  for(const k in cards){const c=cards[k];const x=T-c.a;const p=0.7*eIO(clamp(x/0.33))+0.3*eOutC(clamp(x/0.55));c.el.style.opacity=p}
  for(const a of anims){const p=eOutC(clamp((T-a.a)/a.d));a.el.style.opacity=p;a.el.style.transform=a.dy?`translateY(${(1-p)*a.dy}px)`:''}
  // donut
  const dp=0.992*eIO(clamp((T-2.82)/0.66));
  const C=2*Math.PI*68; document.getElementById('dring').setAttribute('stroke-dasharray',`${dp*C} ${C}`);
  document.getElementById('dring').style.opacity=dp>0.002?1:0;
  dnum.textContent=(dp*100).toFixed(1)+'%';
  const w=dnum.offsetWidth; dnum.style.left=(190.8-w/2)+'px';
  // queries
  for(const q of qIcons){const p=clamp((T-q.t)/0.06);q.sp.style.opacity=1-p;q.ck.style.opacity=p;q.ck.style.transform=`scale(${0.7+0.3*eOutC(p)})`;q.sp.style.transform=`rotate(${T*540}deg)`}
  // bars
  const hl=clamp((T-3.8)/0.08);
  for(const b of bars){const g=eIO(clamp((T-(2.44+0.017*b.i))/(0.30-0.008*b.i)));b.el.style.height=(b.h*g)+'px';if(b.i===7)b.hb.style.opacity=hl}
  for(const b of syncBars){const g=eIO(clamp((T-(3.58+0.006*b.i))/0.2));b.el.style.height=(b.h*g)+'px'}
  // knob
  const kv=eOutC(clamp((T-3.30)/0.09));
  const idx=knobIdx(T);const i0=Math.floor(idx),f=idx-i0;const b0=bars[i0],b1=bars[Math.min(i0+1,bars.length-1)];
  const kx=b0.cx+(b1.cx-b0.cx)*f, ky=BASE-(b0.h+(b1.h-b0.h)*f)-2;
  knob.style.left=(kx-17)+'px';knob.style.top=(ky-17)+'px';knob.style.opacity=kv;

}
